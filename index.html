<main>

    <div class="layout-principal">

        <!-- QUADRO DE BUSCA E FILTROS -->
        <section class="painel-filtros" aria-labelledby="titulo-filtros">

            <div class="cabecalho-filtros">
                <h2 id="titulo-filtros">Busca e filtros</h2>
                <p>Organize a visualização das tarefas.</p>
            </div>

            <p id="mensagem-status" class="mensagem-status">
                Carregando tarefas...
            </p>

            <form class="formulario-filtros">

                <fieldset>
                    <legend>Filtrar por status</legend>

                    <label for="filtro-status">Status:</label>

                    <select id="filtro-status" name="status">
                        <option value="todos">Todos</option>
                        <option value="a-fazer">A fazer</option>
                        <option value="em-andamento">Em andamento</option>
                        <option value="em-revisao">Em revisão</option>
                        <option value="concluida">Concluída</option>
                    </select>
                </fieldset>


                <fieldset>
                    <legend>Filtrar por prioridade</legend>

                    <label for="filtro-prioridade">Prioridade:</label>

                    <select id="filtro-prioridade" name="prioridade">
                        <option value="todas">Todas</option>
                        <option value="alta">Alta</option>
                        <option value="media">Média</option>
                        <option value="baixa">Baixa</option>
                    </select>
                </fieldset>

            </form>

        </section>


        <!-- QUADRO DE TAREFAS -->
        <section class="painel-quadro" aria-labelledby="titulo-quadro">

            <div class="cabecalho-quadro">
                <h2 id="titulo-quadro">Meu quadro</h2>
                <p>Visualize suas tarefas por etapa.</p>
            </div>


            <div class="quadro-kanban">

                <section class="coluna coluna-a-fazer"
                    aria-labelledby="titulo-a-fazer">

                    <div class="cabecalho-coluna">
                        <h3 id="titulo-a-fazer">A fazer</h3>
                        <span id="contador-a-fazer">0</span>
                    </div>

                    <ul id="lista-a-fazer">
                    </ul>

                </section>


                <section class="coluna coluna-em-andamento"
                    aria-labelledby="titulo-em-andamento">

                    <div class="cabecalho-coluna">
                        <h3 id="titulo-em-andamento">Em andamento</h3>
                        <span id="contador-em-andamento">0</span>
                    </div>

                    <ul id="lista-em-andamento">
                    </ul>

                </section>


                <section class="coluna coluna-em-revisao"
                    aria-labelledby="titulo-em-revisao">

                    <div class="cabecalho-coluna">
                        <h3 id="titulo-em-revisao">Em revisão</h3>
                        <span id="contador-em-revisao">0</span>
                    </div>

                    <ul id="lista-em-revisao">
                    </ul>

                </section>


                <section class="coluna coluna-concluida"
                    aria-labelledby="titulo-concluida">

                    <div class="cabecalho-coluna">
                        <h3 id="titulo-concluida">Concluída</h3>
                        <span id="contador-concluida">0</span>
                    </div>

                    <ul id="lista-concluida">
                    </ul>

                </section>

            </div>

        </section>

    </div>

</main>
